function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function note(f,d=.14,v=.07,type='triangle',delay=0){if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d+.02)}
function sound(f){if(soundOn)note(f)}function musicStop(){clearInterval(musicTimer);musicTimer=null}function musicStart(){musicStop();if(!musicOn||!active)return;musicTimer=setInterval(()=>{if(!audio||!active)return;let dark=mode==='sub'||(mode==='both'&&Math.floor(correct/20)%2===1),seq=dark?[196,233,261,311,293,261,233,174]:[392,440,523,587,659,587,523,440],f=seq[beat%8];note(f,.18,.035,dark?'sawtooth':'triangle');if(beat%2===0)note(f/2,.36,.035,'sine');if(beat%4===0)note(80,.16,.08,'sine');beat++},215)}
function hud(){let zone=Math.floor(correct/20)+1;$('level').textContent='🗺️ エリア '+zone+'・'+(correct%20+1)+'/20';$('hearts').textContent='❤️'.repeat(life)+'🤍'.repeat(3-life);$('score').textContent='⭐ '+correct;$('coins').textContent='🪙 '+coins;$('weapon').textContent=['','⚔️ ぼうけんの剣','🏹 ひかりの弓','🪄 まほうの杖','⚡ いなずまの杖','🐉 ドラゴンの力'][Math.min(weapon,5)]+' Lv.'+weapon;$('upgrade').textContent='🪙 '+weapon*10+' 強化';$('enemyCount').textContent='🧟 '+mobs.length+' / 5'}
function getWorld(){let z=Math.floor(correct/20),dark=mode==='sub'||(mode==='both'&&z%2===1);return(dark?subWorld:addWorld)[Math.floor(z/(mode==='both'?2:1))%4]}
function worldUpdate(force=false){let w=getWorld();if(!force&&$('scene').dataset.world===w[0])return;$('scene').dataset.world=w[0];$('area').textContent=w[1];$('scenery').replaceChildren();for(let i=0;i<5;i++){let s=document.createElement('span');s.textContent=w[2+i%3];s.style.left=(i%2===0?2+i*8:76+i*3)+'%';s.style.top=(i%3===0?42:57)+'%';$('scenery').append(s)}if(active){let c=document.createElement('div');c.className='world-card';c.innerHTML='<span>'+w[2]+'</span><small>NEW ADVENTURE</small><strong>'+w[1]+'</strong><small>あたらしい世界へ！</small>';$('scene').append(c);setTimeout(()=>c.remove(),1700);musicStart()}}
function generate(){let a,b,op;if(mode==='add'||mode==='both'&&Math.random()<.5){a=1+Math.floor(Math.random()*6);b=1+Math.floor(Math.random()*(10-a));op='＋'}else{a=2+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*a);op='−'}return{a,b,op,ans:op==='＋'?a+b:a-b}}
function spawn(){if(!active||mobs.length>=5)return;const q=generate(),id=++uid,lane=[-2,-1,0,1,2].filter(n=>!mobs.some(m=>m.lane===n));if(!lane.length)return;const n=lane[Math.floor(Math.random()*lane.length)],m={id,lane:n,progress:0,q,el:document.createElement('div')};m.el.className='mob';m.el.innerHTML='<span class="mobmath">'+q.a+' '+q.op+' '+q.b+' = ?</span><span class="monster">'+['🧟','🧟‍♂️','🧟‍♀️','👹','👻'][id%5]+'</span>';m.el.addEventListener('click',()=>target(id));$('battlefield').append(m.el);mobs.push(m);place(m);if(selected===null)target(id);hud()}
function place(m){const p=m.progress,scale=.55+p*1.3,spread=11+p*12,x=50+m.lane*spread,y=39+p*40;m.el.style.left=x+'%';m.el.style.top=y+'%';m.el.style.zIndex=String(4+Math.floor(p*10));m.el.style.setProperty('--scale',scale);m.el.dataset.near=String(p>.78)}
function dots(){const el=$('visual');el.hidden=!support;el.replaceChildren();if(!support||!selected)return;const q=selected.q,group=(n,cut=0,orange=false)=>{let g=document.createElement('div');g.className='dots';for(let i=0;i<n;i++){let d=document.createElement('span');d.className='dot'+(orange?' orange':'')+(i>=n-cut?' cross':'');g.append(d)}return g};if(q.op==='＋'){el.append(group(q.a));let s=document.createElement('strong');s.textContent='＋';el.append(s,group(q.b,0,true))}else el.append(group(q.a,q.b))}
function renderTarget(){mobs.forEach(m=>m.el.classList.toggle('selected',m===selected));if(!selected){$('problem').textContent='ゾンビを えらぼう！';$('answers').replaceChildren();dots();return}let q=selected.q;$('problem').textContent=q.a+' '+q.op+' '+q.b+' = ？';dots();let opts=[q.ans],pool=Array.from({length:11},(_,i)=>i).filter(n=>n!==q.ans);while(opts.length<3)opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);opts.sort(()=>Math.random()-.5);$('answers').replaceChildren(...opts.map(n=>{let b=document.createElement('button');b.textContent=n;b.addEventListener('click',()=>answer(n,b));return b}))}
function target(id){if(!active||locked)return;selected=mobs.find(m=>m.id===id)||null;renderTarget();sound(620);$('hint').textContent='🎯 えらんだゾンビを こうげき！'}
function float(msg){let e=document.createElement('div');e.className='floating-text';e.textContent=msg;$('scene').append(e);setTimeout(()=>e.remove(),1000)}
function explosion(m){const rect=$('scene').getBoundingClientRect(),mr=m.el.getBoundingClientRect(),x=mr.left+mr.width/2-rect.left,y=mr.top+mr.height/2-rect.top;let b=document.createElement('div');b.className='mob-explosion';b.style.left=x+'px';b.style.top=y+'px';b.textContent=['','💥','🎯','🌟','⚡','🔥'][Math.min(weapon,5)];$('scene').append(b);setTimeout(()=>b.remove(),700);for(let i=0;i<18;i++){let s=document.createElement('div');s.className='mob-spark';s.style.left=x+'px';s.style.top=y+'px';let ang=i*Math.PI/9,dist=35+(i%4)*22;s.style.setProperty('--dx',Math.cos(ang)*dist+'px');s.style.setProperty('--dy',Math.sin(ang)*dist+'px');$('scene').append(s);setTimeout(()=>s.remove(),800)}$('scene').classList.remove('shake');void $('scene').offsetWidth;$('scene').classList.add('shake');setTimeout(()=>$('scene').classList.remove('shake'),380);if(soundOn){note(110,.3,.12,'sawtooth');note(740,.11,.13,'square');note(240,.2,.1,'triangle',.09)}}
function answer(n,b){if(!active||locked||!selected)return;const m=selected;if(n!==m.q.ans){b.disabled=true;b.style.background='#ff9ba6';$('hint').textContent='もういちど！ ほかのゾンビも近づくよ！';sound(180);return}locked=true;b.style.background='#7cf5b7';const a=b.getBoundingClientRect(),z=m.el.getBoundingClientRect(),beam=document.createElement('div');beam.className='answer-beam';beam.style.left=a.left+a.width/2+'px';beam.style.top=a.top+a.height/2+'px';beam.style.setProperty('--dx',(z.left+z.width/2-a.left-a.width/2)+'px');beam.style.setProperty('--dy',(z.top+z.height/2-a.top-a.height/2)+'px');document.body.append(beam);sound(950);const e=epoch;setTimeout(()=>{beam.remove();if(!active||e!==epoch)return;explosion(m);m.el.classList.add('dying');selected=null;correct++;coins+=3;hud();float('⭐ +3 コイン！');$('hint').textContent='💥 ゾンビを たおした！';if(correct%20===0){coins+=20;float('🎁 エリアクリア！ +20');hud();worldUpdate(true)}setTimeout(()=>{if(!active||e!==epoch)return;m.el.remove();mobs=mobs.filter(x=>x!==m);locked=false;if(!mobs.length)spawn();selected=mobs.slice().sort((a,b)=>b.progress-a.progress)[0]||null;renderTarget();hud()},420)},460)}
function lose(m){m.el.remove();mobs=mobs.filter(x=>x!==m);if(selected===m)selected=null;life--;hud();float('💔 ハート -1');$('scene').classList.add('damage');setTimeout(()=>$('scene').classList.remove('damage'),550);sound(150);if(life<=0){active=false;musicStop();cancelAnimationFrame(raf);$('title').textContent='ゲームオーバー';$('intro').textContent='⭐ '+correct+'もん せいかい！ また ぼうけんしよう！';$('start').textContent='↻ もういちど';$('overlay').classList.remove('hidden')}else{selected=mobs.slice().sort((a,b)=>b.progress-a.progress)[0]||null;renderTarget()}}
function tick(t){if(!active)return;if(!last)last=t;let dt=Math.min(.07,(t-last)/1000);last=t;if(!locked){spawnClock+=dt;if(spawnClock>2.5&&mobs.length<5){spawnClock=0;spawn()}for(const m of [...mobs]){m.progress+=dt/Math.max(22,32-Math.floor(correct/20));place(m);if(m.progress>=1){lose(m);if(!active)break}}$('progress').style.width=(100-Math.max(0,...mobs.map(m=>m.progress))*100)+'%'}raf=requestAnimationFrame(tick)}
function start(){initAudio();cancelAnimationFrame(raf);epoch++;active=true;locked=false;life=3;correct=0;coins=0;weapon=1;last=0;spawnClock=0;selected=null;mobs.forEach(m=>m.el.remove());mobs=[];$('overlay').classList.add('hidden');worldUpdate(true);for(let i=0;i<5;i++)spawn();hud();musicStart();raf=requestAnimationFrame(tick)}
$('start').addEventListener('click',start);$('reset').addEventListener('click',start);
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b));if(active){epoch++;mobs.forEach(m=>m.el.remove());mobs=[];selected=null;locked=false;worldUpdate(true);for(let i=0;i<5;i++)spawn()}else worldUpdate(true)}));
$('support').addEventListener('click',()=>{support=!support;$('support').textContent=support?'🔵 サポート あり':'🔵 サポート なし';$('support').setAttribute('aria-pressed',String(support));dots()});
$('music').addEventListener('click',()=>{musicOn=!musicOn;$('music').textContent=musicOn?'🎵 BGM ON':'🔇 BGM OFF';if(musicOn){initAudio();musicStart()}else musicStop()});
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF';if(soundOn){initAudio();sound(660)}});
$('upgrade').addEventListener('click',()=>{let cost=weapon*10;if(coins<cost){$('hint').textContent='コインが '+cost+'まい ひつよう！';return}coins-=cost;weapon++;hud();sound(880);float('✨ LEVEL UP!')});
hud();worldUpdate(true);renderTarget()})();</script></body></html>
