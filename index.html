*{box-sizing:border-box}body{margin:0;background:#111b2e;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:10px 12px 30px;display:flex;flex-direction:column;gap:9px}.top{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:14px}.pill{background:#ffffff20;padding:7px 9px;border-radius:12px}.scene{position:relative;height:min(42dvh,360px);min-height:245px;overflow:hidden;border:3px solid #71849a;border-radius:22px;isolation:isolate;transition:background .8s}.scene:before{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(#2c653e,#1b3728)}.scene:after{content:"";position:absolute;inset:55% 0 0;background:#b49a72;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%)}.scene[data-world="forest"]{background:linear-gradient(#66b9ed,#d7eec7 48%,#487b49 49%)}.scene[data-world="desert"]{background:linear-gradient(#f4a85c,#f8d98d 48%,#c38a42 49%)}.scene[data-world="sky"]{background:linear-gradient(#536dc8,#b9e9f6 48%,#779ac1 49%)}.scene[data-world="crystal"]{background:linear-gradient(#385a94,#b5b9ec 48%,#565a95 49%)}.scene[data-world="grave"]{background:linear-gradient(#292345,#706185 48%,#40354a 49%)}.scene[data-world="lava"]{background:linear-gradient(#451929,#c44a24 48%,#4e3032 49%)}.scene[data-world="castle"]{background:linear-gradient(#1c1d40,#63517b 48%,#39334b 49%)}.scene[data-world="abyss"]{background:linear-gradient(#10172e,#3b5374 48%,#25324c 49%)}.scene[data-world="grave"]:before,.scene[data-world="castle"]:before,.scene[data-world="abyss"]:before{background:linear-gradient(#4d455c,#27243b)}.scene[data-world="lava"]:before{background:linear-gradient(#8c4930,#39292d)}.scene[data-world="desert"]:before{background:linear-gradient(#ddb467,#a97b44)}.scene[data-world="sky"]:before{background:linear-gradient(#a8d7e6,#6b9cbb)}.scene[data-world="crystal"]:before{background:linear-gradient(#847fba,#454c86)}.scene[data-world="grave"]:after,.scene[data-world="castle"]:after,.scene[data-world="abyss"]:after{background:#62586a}.scene[data-world="lava"]:after{background:#80615b}.scenery{position:absolute;inset:0;z-index:1;pointer-events:none}.scenery span{position:absolute;font-size:clamp(35px,10vw,64px);filter:drop-shadow(0 6px 3px #0004)}.enemy{position:absolute;left:50%;top:54%;z-index:2;font-size:95px;transform:translate(-50%,-50%) scale(.25);will-change:transform,top;filter:drop-shadow(0 5px 5px #0008)}.hero{position:absolute;bottom:-4px;left:5%;font-size:57px;z-index:3;filter:drop-shadow(0 4px 3px #0008)}.shot{position:absolute;z-index:4;bottom:55px;left:24%;font-size:36px;opacity:0;pointer-events:none}.shot.fire{animation:shoot .5s ease-out forwards}@keyframes shoot{0%{opacity:1;transform:translate(0,0) scale(.8)}100%{opacity:1;transform:translate(125px,-120px) scale(1.8)}}.banner{position:absolute;z-index:5;top:13%;width:100%;text-align:center;font-weight:1000;font-size:27px;text-shadow:0 3px 6px #000}.area{position:absolute;z-index:3;top:8px;left:8px;background:#15283dc9;padding:7px 10px;border-radius:12px;font-weight:800;font-size:13px}.overlay{position:absolute;z-index:10;inset:0;background:#101b31ee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:15px}.overlay h1{margin:0;font-size:25px}.overlay p{margin:0;line-height:1.7}.hidden{display:none!important}.bar{height:9px;border-radius:8px;overflow:hidden;background:#53647d}.bar div{height:100%;background:#ffca56;width:100%}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button{touch-action:manipulation;border:0;border-radius:14px;padding:12px 7px;background:#fff;color:#18304c;font-size:22px;font-weight:900;cursor:pointer}button:disabled{opacity:.5}.modes button{font-size:14px;background:#30455f;color:#fff;border:2px solid transparent}.modes button.selected{background:#4cdda2;color:#10342b;border-color:white}.problem{text-align:center;font-size:37px;font-weight:1000}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.answers button{font-size:32px;padding:15px 6px}.visual{display:flex;align-items:center;justify-content:center;gap:10px;min-height:57px;background:#ffffff13;border-radius:13px;padding:7px}.visual[hidden]{display:none}.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:170px}.dot{width:19px;height:19px;border-radius:50%;background:#63b8ff;position:relative}.dot.orange{background:#ffba55}.dot.cross{opacity:.45}.dot.cross:after{content:"";position:absolute;top:8px;left:-1px;width:21px;height:3px;background:#ed4263;transform:rotate(-40deg)}.hint{text-align:center;font-size:14px;min-height:21px}.controls{display:flex;flex-wrap:wrap;gap:6px}.controls button{background:#30455f;color:white;font-size:13px;padding:9px 10px}.primary{background:#4cdda2;color:#12392e;font-size:22px;padding:15px 30px}.treasure{background:#253954;border:1px solid #637a94;border-radius:12px;padding:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}.treasure button{font-size:13px;padding:8px 11px;background:#f4c35e}.bossbar{position:absolute;z-index:5;left:20%;right:20%;bottom:10px;height:10px;background:#4b2434;border:1px solid white;border-radius:9px;overflow:hidden}.bossbar div{height:100%;background:#ff5e74;width:100%}
</style></head><body><main><div class="top"><span class="pill" id="level">🗺️ エリア 1・1/20</span><span class="pill" id="hearts">❤️❤️❤️</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="coins">🪙 0</span></div><div class="scene" id="scene" data-world="forest"><div class="scenery" id="scenery"></div><div class="area" id="area">🌲 ひかりの森</div><div class="enemy" id="enemy">🧟</div><div class="hero" id="hero">🧙</div><div class="shot" id="shot">✨</div><div class="banner" id="banner"></div><div class="bossbar hidden" id="bossbar"><div id="bossfill"></div></div><div class="overlay" id="overlay"><h1 id="title">⚔️ ゾンビ算数の大冒険</h1><p id="intro">2つの王国を冒険しよう！<br>20問クリアで新しい世界へ！</p><button id="start" class="primary">▶ ぼうけんスタート</button></div></div><div class="bar"><div id="progress"></div></div><div class="modes" id="modes"><button data-mode="add">➕ 足し算</button><button data-mode="sub">➖ 引き算</button><button data-mode="both" class="selected">🔀 両方</button></div><div class="problem" id="problem">3 ＋ 4 = ？</div><div id="visual" class="visual" hidden></div><div class="answers" id="answers"><button disabled>6</button><button disabled>7</button><button disabled>8</button></div><div class="hint" id="hint">正解してゾンビをたおそう！</div><div class="treasure"><span id="weapon">⚔️ ぼうけんの剣 Lv.1</span><button id="upgrade">🪙 10 強化</button></div><div class="controls"><button id="music">🎵 BGM ON</button><button id="sound">🔊 効果音 ON</button><button id="support" aria-pressed="false">🔵 サポート なし</button><button id="reset">↻ はじめから</button></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let mode='both',support=false,musicOn=true,soundOn=true,active=false,locked=true,correct=0,life=3,coins=0,weapon=1,answer=0,va=3,vb=4,vo='＋',remaining=1,last=0,raf=0,epoch=0,bossHP=0,world='forest',audio=null,musicTimer=null,step=0,nextBeat=0;const addWorld=[['forest','🌲 ひかりの森','🌳','🌲','🌿'],['desert','🏜️ たいよう砂漠','🌵','🪨','🌴'],['sky','☁️ そらの神殿','☁️','🏛️','🌤️'],['crystal','💎 クリスタル谷','💎','🔮','✨']];const subWorld=[['grave','🌙 おばけの墓地','🪦','🌲','🦇'],['lava','🌋 ほのおの洞窟','🌋','🔥','🪨'],['castle','🏰 まおうの城','🏰','🗼','🌑'],['abyss','🌌 やみの神殿','🕸️','🔮','🌑']];const melody=[392,440,523,587,659,587,523,440,392,523,587,659,784,659,587,523,349,392,440,523,587,523,440,392,330,392,440,523,440,392,349,330],bass=[196,196,174.61,174.61,164.81,164.81,196,196];function audioInit(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}function note(f,t,d,v,type){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d+.03)}function fx(f,d=.16){if(soundOn&&audio)note(f,audio.currentTime+.005,d,.09,'triangle')}function noise(t,d,v,freq){if(!audio)return;let n=Math.ceil(audio.sampleRate*d),buf=audio.createBuffer(1,n,audio.sampleRate),arr=buf.getChannelData(0);for(let i=0;i<n;i++)arr[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(audio.destination);s.start(t);s.stop(t+d)}function hitSound(boss){if(!soundOn||!audio)return;let t=audio.currentTime+.01;noise(t,.15,.17,2600);note(740,t,.09,.12,'sawtooth');note(240,t+.08,.2,.15,'triangle');noise(t+.12,.22,.17,700);note(95,t+.13,.25,.12,'sine');if(boss){note(392,t+.3,.18,.1,'square');note(523,t+.47,.18,.1,'square');note(784,t+.64,.45,.12,'triangle')}}function drum(t,k){if(k===0){note(85,t,.17,.14,'sine');note(48,t+.04,.2,.08,'sine')}else noise(t,k===1?.13:.05,k===1?.06:.025,k===1?1900:5000)}function stopMusic(){if(musicTimer!==null)clearInterval(musicTimer);musicTimer=null}function musicTick(){if(!active||!musicOn||!audio)return;let dark=['grave','lava','castle','abyss'].includes(world),roots=dark?[146.83,130.81,174.61,164.81]:[196,174.61,164.81,196],scale=dark?.75:1;while(nextBeat<audio.currentTime+.18){let s=step%32,root=roots[Math.floor(s/8)],t=nextBeat;note(melody[s]*scale,t,.2,.043,dark?'sawtooth':'triangle');if(s%2===0)note(melody[s]*scale/2,t,.34,.02,'sine');if(s%4===0){note(root,t,.72,.06,'sawtooth');note(root*1.5,t,.7,.024,'triangle')}if(s%8===0||s%8===4)drum(t,0);if(s%8===2||s%8===6)drum(t,1);if(s%2===1)drum(t,2);step++;nextBeat+=.205}}function startMusic(){stopMusic();if(!active||!musicOn||!audio)return;step=0;nextBeat=audio.currentTime+.06;musicTick();musicTimer=setInterval(musicTick,60)}function hud(){let area=Math.floor(correct/20)+1,pos=correct%20+1;$('level').textContent='🗺️ エリア '+area+'・'+pos+'/20';$('hearts').textContent='❤️'.repeat(life)+'🤍'.repeat(3-life);$('score').textContent='⭐ '+correct;$('coins').textContent='🪙 '+coins;$('weapon').textContent=['','⚔️ ぼうけんの剣','🏹 ひかりの弓','🪄 まほうの杖','⚡ いなずまの杖','🐉 ドラゴンの力'][Math.min(weapon,5)]+' Lv.'+weapon;$('upgrade').textContent='🪙 '+(weapon*10)+' 強化'}function currentWorld(){let idx=Math.floor(correct/20),dark=mode==='sub'||(mode==='both'&&idx%2===1);return(dark?subWorld:addWorld)[Math.floor(idx/(mode==='both'?2:1))%4]}function changeWorld(){let w=currentWorld();if(world!==w[0]){world=w[0];$('scene').dataset.world=world;$('area').textContent=w[1];$('scenery').replaceChildren();for(let i=0;i<5;i++){let s=document.createElement('span');s.textContent=w[2+i%3];s.style.left=(i%2===0?2+(i*8):77+(i*3))+'%';s.style.top=(i%3===0?43:57)+'%';$('scenery').append(s)}startMusic()}else{$('area').textContent=w[1]}}function renderDots(){let el=$('visual');el.hidden=!support;if(!support)return;el.replaceChildren();const group=(n,cut=0,orange=false)=>{let g=document.createElement('div');g.className='dots';for(let i=0;i<n;i++){let d=document.createElement('span');d.className='dot'+(orange?' orange':'')+(i>=n-cut?' cross':'');g.append(d)}return g};let sign=document.createElement('strong');sign.textContent=vo;sign.style.fontSize='24px';if(vo==='＋')el.append(group(va),sign,group(vb,0,true));else el.append(group(va,vb))}function question(){let a,b,op;if(mode==='add'||(mode==='both'&&Math.random()<.5)){a=1+Math.floor(Math.random()*6);b=1+Math.floor(Math.random()*(10-a));answer=a+b;op='＋'}else{a=2+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*a);answer=a-b;op='−'}va=a;vb=b;vo=op;$('problem').textContent=a+' '+op+' '+b+' = ？';renderDots();let choices=[answer],pool=Array.from({length:11},(_,i)=>i).filter(x=>x!==answer);while(choices.length<3){let n=pool.splice(Math.floor(Math.random()*pool.length),1)[0];choices.push(n)}for(let i=choices.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]]}$('answers').replaceChildren(...choices.map(n=>{let b=document.createElement('button');b.textContent=n;b.addEventListener('click',()=>choose(n,b));return b}))}function draw(){$('enemy').style.transform='translate(-50%,-50%) scale('+(0.23+2.55*(1-remaining))*(bossHP?1.25:1)+')';$('enemy').style.top=(54+20*(1-remaining))+'%';$('progress').style.width=(remaining*100)+'%'}function next(){epoch++;locked=false;remaining=1;last=0;changeWorld();bossHP=correct%20===19?3:0;$('enemy').textContent=bossHP?'👹':'🧟';$('bossbar').classList.toggle('hidden',!bossHP);$('bossfill').style.width='100%';$('banner').textContent=bossHP?'⚠️ ボスが あらわれた！':'';$('hint').textContent=bossHP?'3問せいかいして ボスをたおそう！':'はやく こたえよう！';question();hud();draw()}function shoot(){let s=$('shot');s.textContent=['','⚔️','🏹','✨','⚡','🔥'][Math.min(weapon,5)];s.classList.remove('fire');void s.offsetWidth;s.classList.add('fire');hitSound(false)}function reward(){coins+=3;correct++;hud();if(correct%20===0){locked=true;$('enemy').textContent='🎁';$('banner').textContent='🎉 エリア クリア！';$('hint').textContent='宝箱から コイン20まい！';coins+=20;hud();let e=++epoch;setTimeout(()=>{if(active&&e===epoch)next()},1800)}else{let e=++epoch;setTimeout(()=>{if(active&&e===epoch)next()},680)}}function choose(n,b){if(!active||locked)return;if(n!==answer){b.disabled=true;b.style.background='#ffa6a6';fx(180,.2);$('hint').textContent='もういっかい！';return}locked=true;shoot();if(bossHP){if(bossHP===1)hitSound(true);bossHP--;$('bossfill').style.width=(bossHP/3*100)+'%';$('banner').textContent=bossHP?'💥 ボスに ダメージ！':'🏆 ボスを たおした！';if(bossHP){let e=++epoch;setTimeout(()=>{if(active&&e===epoch){locked=false;remaining=Math.max(remaining,.55);last=0;question();$('banner').textContent='👹 あと'+bossHP+'かい！'}},650);return}}$('enemy').textContent='💥';$('banner').textContent=bossHP?'💥':'✨ せいかい！';reward()}function hit(){locked=true;life--;fx(120,.3);hud();$('banner').textContent='💢 あぶない！';if(life<=0){active=false;stopMusic();$('title').textContent='ゲームオーバー';$('intro').textContent='⭐ '+correct+'もん せいかい！ また ぼうけんしよう！';$('start').textContent='↻ もういちど';$('overlay').classList.remove('hidden');return}let e=++epoch;setTimeout(()=>{if(active&&e===epoch)next()},900)}function tick(t){if(!active)return;if(!last)last=t;let dt=Math.min(.1,(t-last)/1000);last=t;if(!locked){remaining=Math.max(0,remaining-dt/Math.max(13,21-Math.floor(correct/20)));draw();if(remaining===0)hit()}raf=requestAnimationFrame(tick)}function start(){audioInit();cancelAnimationFrame(raf);epoch++;correct=0;life=3;coins=0;weapon=1;active=true;world='';$('overlay').classList.add('hidden');next();startMusic();raf=requestAnimationFrame(tick)}$('start').addEventListener('click',start);$('reset').addEventListener('click',start);document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b));if(active){world='';next()}else{world='';changeWorld();$('hint').textContent='ぼうけんの世界を えらんだよ！'}}));$('support').addEventListener('click',()=>{support=!support;$('support').textContent=support?'🔵 サポート あり':'🔵 サポート なし';$('support').setAttribute('aria-pressed',String(support));renderDots()});$('music').addEventListener('click',()=>{musicOn=!musicOn;$('music').textContent=musicOn?'🎵 BGM ON':'🔇 BGM OFF';if(musicOn){audioInit();startMusic()}else stopMusic()});$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF';if(soundOn){audioInit();fx(660)}});$('upgrade').addEventListener('click',()=>{let cost=weapon*10;if(coins<cost){$('hint').textContent='コインが '+cost+'まい ひつよう！';return}coins-=cost;weapon++;hud();fx(880);$('hint').textContent='🎉 あたらしい武器をゲット！'});hud();changeWorld();renderDots();draw()})();
</script></body></html>
